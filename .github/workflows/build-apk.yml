name: Build AJ Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Decode signing keystore
        env:
          AJ_KEYSTORE_BASE64: ${{ secrets.AJ_KEYSTORE_BASE64 }}
        run: |
          echo "$AJ_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aj-launcher-new.jks"
          echo "AJ_KEYSTORE_FILE=$RUNNER_TEMP/aj-launcher-new.jks" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        env:
          AJ_KEYSTORE_PASSWORD: ${{ secrets.AJ_KEYSTORE_PASSWORD }}
          AJ_KEY_ALIAS: ${{ secrets.AJ_KEY_ALIAS }}
        run: gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AJ-Launcher-release-APK
          path: '**/build/outputs/apk/release/*.apk'
