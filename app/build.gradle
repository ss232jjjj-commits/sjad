plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aj.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aj.launcher'
        minSdk 33
        targetSdk 33
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("AJ_KEYSTORE_FILE") ?: "aj-launcher-new.jks")
            storePassword System.getenv("AJ_KEYSTORE_PASSWORD")
            keyAlias System.getenv("AJ_KEY_ALIAS")
            keyPassword System.getenv("AJ_KEYSTORE_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
